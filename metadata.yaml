name: astrbot_plugin_msg_forward_cc # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: 跨平台消息转发 # 用于展示的名字，可以是方便人类阅读的名字（需要版本 >= v4.5.0，低版本不会报错，请放心填写）
desc: 修改自 Siaospeed 版本，提供 Web 管理和消息控制支持。用于在不同聊天平台及群聊之间转发与同步消息，也可用于全自动搬屎（搬史、搬石） # 插件简短描述
version: v0.4.0 # 插件版本号。格式：v1.1.1 或者 v1.1
author: XTsat # 作者
repo: https://github.com/XTsat/astrbot_plugin_msg_forward_cc # 插件的仓库地址
astrbot_version: ">=4.5.0" # 插件要求的 AstrBot 版本范围
support_platforms: # 支持的消息平台
  - aiocqhttp
  - qq_official
  - qq_official_webhook
  - telegram
  - wecom
  - wecom_ai_bot
  - lark
  - dingtalk
  - discord
  - slack
  - kook
  - vocechat
  - weixin_official_account
  - weixin_oc
  - satori
  - misskey
  - line
  - matrix
  - mattermost
